[project]
name = "tiktok-to-text"
version = "0.1.0"
description = "TikTok URL -> audio -> transcription (Whisper)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2024.1.0",
  "openai-whisper>=20231117",
]

[project.scripts]
tiktok-to-text = "tiktok_to_text.cli:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]

[tool.ruff]
extend-exclude = [
  "notebooks/",
  "outputs/",
  ".venv/",
  "notebooks/02_download_metadata.py",
]
